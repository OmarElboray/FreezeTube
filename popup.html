<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freeze Tube</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&display=swap" rel="stylesheet">
    <style>
        /* --- Brand Variables --- */
        :root {
            --bg-pure: #ffffff;
            --bg-subtle: #f8f9fa;
            --text-dark: #121212;
            --text-grey: #5f6368;
            --text-light: #9aa0a6;
            --accent-cyan: #00e5ff;
            --accent-cyan-hover: #00c4db;
            --accent-red: #ff4d4d;
        }

        /* --- Global Reset --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 320px; /* Standard extension popup width */
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-pure);
            color: var(--text-dark);
            -webkit-font-smoothing: antialiased;
            display: flex;
            flex-direction: column;
            min-height: 250px;
        }

        /* --- Header --- */
        header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 20px;
            border-bottom: 1px solid #eaeaea;
            background-color: var(--bg-subtle);
        }

        .ft-logo-placeholder {
            width: 28px;
            height: 28px;
            background-color: var(--accent-cyan);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-dark);
            font-size: 0.5rem;
            font-weight: 800;
        }

        h1 {
            font-size: 1.2rem;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        /* --- Main Controls --- */
        main {
            padding: 30px 20px;
            text-align: center;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 15px;
        }

        .status-text {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-grey);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* The main toggle button used in your popup.js */
        #toggleBtn {
            width: 100%;
            background-color: var(--accent-cyan);
            color: var(--text-dark);
            border: none;
            padding: 16px;
            font-family: 'Montserrat', sans-serif;
            font-weight: 800;
            font-size: 1.1rem;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(0, 229, 255, 0.25);
        }

        #toggleBtn:hover {
            background-color: var(--accent-cyan-hover);
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(0, 229, 255, 0.35);
        }

        #toggleBtn:active {
            transform: translateY(1px);
            box-shadow: 0 2px 10px rgba(0, 229, 255, 0.2);
        }

        /* State when feed is frozen (toggled via JS) */
        #toggleBtn.frozen {
            background-color: var(--bg-subtle);
            color: var(--accent-red);
            border: 2px solid var(--accent-red);
            box-shadow: none;
        }

        #toggleBtn.frozen:hover {
            background-color: #fff0f0;
        }

        /* --- Footer (TD Branding) --- */
        footer {
            padding: 15px;
            border-top: 1px solid #eaeaea;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background-color: var(--bg-pure);
        }

        .footer-text {
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--text-light);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .td-brand {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--text-dark);
            font-weight: 700;
            font-size: 0.8rem;
            text-decoration: none;
        }

        .td-logo-placeholder {
            width: 18px;
            height: 18px;
            background-color: var(--text-dark);
            border-radius: 3px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--bg-pure);
            font-size: 0.4rem;
            font-weight: 800;
        }
    </style>
</head>
<body>

    <header>
        <!-- Replace with your Freeze Tube Logo -->
       <img src="icons/icon48.png" alt="Freeze Tube Logo" style="width: 28px; height: 28px; border-radius: 6px;">

        <h1>Freeze Tube</h1>
    </header>

    <main>
        <div class="status-text" id="statusText">Algorithm Active</div>
        <!-- This ID matches your popup.js -->
        <button id="toggleBtn">Freeze Feed</button>
    </main>

    <footer>
        <span class="footer-text">Built by</span>
        <a href="#" class="td-brand">
            <!-- Replace with your Tiny Developments Logo -->
          <img src="icons/td-logo.png" alt="Tiny Developments" style="width: 18px; height: 18px; border-radius: 3px;">

            Tiny Developments
        </a>
    </footer>

    <script src="popup.js"></script>
</body>
</html>
